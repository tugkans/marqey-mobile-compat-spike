name: iOS D-018 Compat Spike
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Env info
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          xcode-select -p
          xcodebuild -version
          gem list cocoapods | grep cocoapods
          ruby --version
          node --version
          npm --version
      - name: Node deps
        shell: bash
        run: |
          set -euo pipefail
          npm install 2>&1 | tail -20
      - name: CocoaPods install
        working-directory: ios
        shell: bash
        env:
          RCT_NEW_ARCH_ENABLED: 1
          USE_FRAMEWORKS: static
        run: |
          set -euo pipefail
          pod --version
          pod install --verbose > /tmp/pod-install.log 2>&1 && POD_EXIT=$? || POD_EXIT=$?
          echo "POD_EXIT=$POD_EXIT"
          tail -200 /tmp/pod-install.log
          test -f Podfile.lock || { echo "FATAL: Podfile.lock missing after pod install"; exit 1; }
          exit $POD_EXIT
      - name: Podfile.lock native modules
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          test -f Podfile.lock || { echo "FATAL: Podfile.lock missing"; exit 1; }
          echo "=== Native modules in Podfile.lock ==="
          grep -E "React-Core|RNCWebView|LiveKitReactNative|LiveKitWebRTC|Firebase|Fabric|WebRTC" Podfile.lock | head -50 || true
          echo "=== Full Podfile.lock (first 100 lines) ==="
          head -100 Podfile.lock
      - name: Build iOS (simulator, no signing)
        working-directory: ios
        shell: bash
        run: |
          set -uo pipefail
          test -d MarqeyCompatSpike.xcworkspace || { echo "FATAL: xcworkspace missing"; exit 1; }
          xcodebuild -workspace MarqeyCompatSpike.xcworkspace \
            -scheme MarqeyCompatSpike \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build \
            CODE_SIGNING_ALLOWED=NO \
            > /tmp/xcodebuild.log 2>&1
          EXIT=$?
          echo "BUILD_EXIT=$EXIT"
          tail -400 /tmp/xcodebuild.log
          exit $EXIT
      - name: Deployment target evidence
        if: always()
        shell: bash
        run: |
          grep -m1 -o "IPHONEOS_DEPLOYMENT_TARGET=[0-9.]*" /tmp/xcodebuild.log || true
          grep -m1 -o "\-target arm64-apple-ios[0-9.]*-simulator" /tmp/xcodebuild.log || true
          grep -c "arm64-apple-ios16.0-simulator" /tmp/xcodebuild.log || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs-ios16
          path: |
            ios/Podfile
            ios/Podfile.lock
            package-lock.json
            /tmp/pod-install.log
            /tmp/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7
